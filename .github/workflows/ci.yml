name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run test
      - run: bun run build

      # Catches packaging mistakes an ordinary build cannot: a broken exports map, a
      # `types` entry pointing nowhere, a `files` list that leaves out the stylesheet.
      - run: bunx publint

      # The type declarations are hand-written, so nothing else proves they compile.
      # A consumer on `strict` is the only audience that matters here.
      - name: Typecheck the declarations
        run: |
          cat > /tmp/consumer.tsx <<'EOF'
          import {
            PDFViewer,
            usePdfViewer,
            useViewerState,
            flattenPdf,
            DEFAULT_TOOLBAR_ACTIONS,
          } from './dist/index'
          import type { Annotation, PdfViewerHandle } from './dist/index'

          const viewer: PdfViewerHandle = usePdfViewer()
          const signed: boolean = useViewerState(viewer, (s) => s.hasSpecimen)

          const describe = (a: Annotation): string =>
            a.type === 'image' ? a.assetId : a.type === 'text' ? a.text : String(a.points.length)

          export const el = (
            <PDFViewer
              viewer={viewer}
              src="/a.pdf"
              config={{
                specimenAsset: '/sign.png',
                toolbar: { displayActions: DEFAULT_TOOLBAR_ACTIONS.filter((id) => id !== 'image') },
              }}
            />
          )

          // Several documents through one viewer, with the host holding a draft per file.
          const drafts: Record<string, Annotation[]> = {}

          export const tabbed = (
            <PDFViewer
              viewer={viewer}
              src="/lampiran-1.pdf"
              documentId="lampiran-1"
              config={{
                initialAnnotations: drafts['lampiran-1'],
                onAnnotationsSnapshot: (annotations, { documentId }) => {
                  if (documentId !== undefined) drafts[String(documentId)] = annotations
                },
              }}
            />
          )

          export const restore = (saved: Annotation[]): void => viewer.setAnnotations(saved)

          // Submit: every attachment with its own annotations, no viewer involved.
          export const submit = (ids: string[]): Promise<Blob[]> =>
            Promise.all(
              ids.map((id) =>
                flattenPdf({ src: `/${id}.pdf`, annotations: drafts[id] ?? [], stampAssets: {} })
              )
            )

          export { signed, describe }
          EOF
          cp /tmp/consumer.tsx ./consumer-typecheck.tsx
          bunx tsc --noEmit --strict --jsx react-jsx \
            --moduleResolution bundler --module esnext --target es2022 \
            consumer-typecheck.tsx
          rm -f consumer-typecheck.tsx

      # The published bundle must never carry the 1.2 MB worker inline. Vite library mode
      # inlines assets and ignores assetsInlineLimit, so one stray `?url` import would do
      # it — and the only visible symptom is a package fifteen times too big.
      - name: Guard the bundle size
        run: |
          size=$(stat -c%s dist/pdf-viewer.js)
          echo "dist/pdf-viewer.js is $size bytes"
          test "$size" -lt 200000 || { echo "Bundle far larger than expected — asset inlined?"; exit 1; }
          test -f dist/pdf.worker.min.js || { echo "Bundled worker missing from dist/"; exit 1; }
          test ! -d dist/assets || { echo "dist/assets/ should not exist — duplicate worker?"; exit 1; }

      # pdf.js fetches these at runtime and has no default location for them. Missing, it
      # does not report an error: a CCITT or JBIG2 stencil that cannot be decoded is painted
      # in full, so a scanned logo renders as a solid black rectangle on an otherwise perfect
      # page. Nothing in the test suite can see that, so the files are checked here.
      - name: Guard the pdf.js runtime assets
        run: |
          for f in jbig2.wasm openjpeg.wasm qcms_bg.wasm; do
            test -f "dist/wasm/$f" || { echo "dist/wasm/$f missing — scanned images will render black"; exit 1; }
          done
          # Redistributing the binaries obliges us to redistribute their licences.
          for f in LICENSE_JBIG2 LICENSE_OPENJPEG LICENSE_QCMS; do
            test -f "dist/wasm/$f" || { echo "dist/wasm/$f missing — required to redistribute the binary"; exit 1; }
          done
          test -n "$(ls -A dist/standard_fonts 2>/dev/null)" || { echo "dist/standard_fonts/ empty — unembedded standard fonts will be substituted"; exit 1; }
          echo "wasm $(du -sh dist/wasm | cut -f1), fonts $(du -sh dist/standard_fonts | cut -f1)"
